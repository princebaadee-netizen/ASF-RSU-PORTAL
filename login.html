<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in — ASF RSU Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="home.html" aria-label="ASF RSU Portal home">
      <img src="download.png" alt="ASF RSU Portal logo" class="logo">
    </a>
    <nav>
      <a href="home.html">Home</a>
    </nav>
  </header>

  <form class="login-box" id="loginForm">
    <div class="welcome-section">
      <h1>Welcome to ASF RSU Document Portal</h1>
      <p>Sign in to your department workspace</p>
    </div>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <label>
      <input type="checkbox" id="showPassword" />
      Show password
    </label>

    <button id="loginBtn" type="submit">Log in</button>

    <p id="errorMsg" style="color: red;"></p>

    <p class="forgot-link"><a href="reset-password.html">Forgot password?</a></p>
  </form>

  <footer>
    <p>ASF RSU Document Portal &middot; <a href="mailto:asfrsu.portal@example.com">asfrsu.portal@example.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="int.js"></script>
</body>
</html>
