<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archive — ASF RSU Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="home.html" aria-label="ASF RSU Portal home">
      <img src="download.jpg" alt="ASF RSU Portal logo" class="logo">
    </a>
    <nav>
      <a href="home.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <h1>Archive</h1>
    <a href="dashboard.html">Back to dashboard</a>

  <h2>Browse</h2>
  <select id="archDeptSelect">
    <option value="">Loading departments...</option>
  </select>
  <select id="archFolderSelect">
    <option value="Monthly Reports">Monthly Reports</option>
    <option value="Plan of Work">Plan of Work</option>
    <option value="Programs/Schedule">Programs/Schedule</option>
    <option value="Inventories">Inventories</option>
  </select>

  <h2>Search</h2>
  <input type="text" id="archSearchInput" placeholder="Search by file name..." />

  <h2>Files</h2>
    <ul id="archFileList">Choose a department and folder to begin.</ul>
  </main>

  <footer>
    <p>ASF RSU Document Portal &middot; <a href="mailto:asfrsu.portal@example.com">asfrsu.portal@example.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="archive.js"></script>

</html>
