<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — ASF RSU Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="home.html" aria-label="ASF RSU Portal home">
      <img src="download.png" alt="ASF RSU Portal logo" class="logo">
    </a>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Log in</a>
    </nav>
  </header>

  <form class="login-box" id="requestForm">
    <div class="welcome-section">
      <h1>Reset your password</h1>
      <p>Enter your email address and we'll send you a link to set a new password.</p>
    </div>

    <input type="email" id="resetEmail" placeholder="Email" />
    <button type="submit" id="requestBtn">Send reset link</button>
    <p id="requestMsg"></p>
  </form>

  <form class="login-box" id="newPasswordForm" style="display: none;">
    <div class="welcome-section">
      <h1>Set a new password</h1>
      <p>Enter your new password below.</p>
    </div>

    <input type="password" id="newPassword" placeholder="New password" />
    <input type="password" id="confirmPassword" placeholder="Confirm new password" />
    <button type="submit" id="updateBtn">Update password</button>
    <p id="updateMsg"></p>
  </form>

  <footer>
    <p>ASF RSU Document Portal &middot; <a href="mailto:asfrsu.portal@example.com">asfrsu.portal@example.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
